[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-umc-cognitive-node"
version = "0.0.9"
description = "Semantic reasoning and GenAI edge node powered by Hailo-10 - integrates VLA-Engine, Voice-UI, Semantic-Planner and Docs-QA into a single cognitive node."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" },
]
keywords = ["hydra-umc", "hailo-10", "genai", "llm", "robotics", "edge-ai"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/JuanenRac/HYDRA-UMC-COGNITIVE-NODE"

[project.scripts]
hydra-umc-cognitive-node = "hydra_umc_cognitive_node.main:main"

[tool.setuptools.packages.find]
where = ["src"]
