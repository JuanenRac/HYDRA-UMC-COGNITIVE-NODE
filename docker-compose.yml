#
# Integration map for the Cognitive AI Node (Hailo-10 + CM5). This node is
# a real integration repo (not documentation-only): it owns the HydraOS
# image (os/) and the quantized LLM/VLA weights (models/) shared by its
# four children, and this file documents/reserves how those four children
# attach to it as sibling services on the same physical board.
#
# STATUS: this node's own Dockerfile plus all four children
# (hydra-umc-vla-engine, hydra-umc-voice-ui, hydra-umc-semantic-planner,
# hydra-umc-docs-qa) now have a real Dockerfile of their own. `docker
# compose up` builds and runs the real thing now, not just documents the
# wiring. Not build-tested (no Docker runtime on this dev machine) - every
# path/flag matches what each service's own systemd unit already runs
# live on the real CM5, same verification standard as
# HYDRA-UMC-VISION-NODE's own sibling Dockerfiles (0.0.7).
#
# `mem_limit` below mirrors each service's own already-chosen real
# MemoryMax from its systemd unit (systemd/*.service in this repo/each
# sibling repo) - never a new, invented number - so a container never
# gets a looser ceiling than the same service already runs under on bare
# metal. `healthcheck` hits each service's own real, already-existing
# lightweight GET route (`/health` for voice-ui, `/stats` everywhere
# else) - none of these routes were added for this file, they already
# existed for their own service's own tests/CLI.
# =============================================================================
version: "3.9"

services:
  cognitive-node:
    build: .
    image: hydra-umc-cognitive-node:1.0.0
    container_name: hydra-umc-cognitive-node
    devices:
      - /dev/hailo0:/dev/hailo0   # Hailo-10 NPU passthrough (CM5 host)
    volumes:
      - ./models:/opt/hydra/models:ro   # shared quantized LLM/VLA weights
      - ./os:/opt/hydra/os:ro           # HydraOS image/config reference
    depends_on:
      - voice-ui
      - semantic-planner
      - vla-engine
      - docs-qa
    restart: unless-stopped
    mem_limit: 384m   # matches systemd/hydra-umc-cognitive-node.service's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Speech-to-Action pipeline (STT/TTS). Feeds recognized intent to the
  # semantic-planner service. See ../HYDRA-UMC-VOICE-UI.
  voice-ui:
    build: ../HYDRA-UMC-VOICE-UI
    image: hydra-umc-voice-ui:1.0.0
    container_name: hydra-umc-voice-ui
    # http_service.py's own open_gateway() refuses to bind beyond
    # loopback without a real bearer token (by design - see this
    # image's own Dockerfile comment) - supply a real secret via a real
    # .env file or your secret manager, never a value committed here.
    environment:
      - HYDRA_UMC_VOICE_UI_TOKEN=${HYDRA_UMC_VOICE_UI_TOKEN:?set a real token - see this file's own comment}
    restart: unless-stopped
    mem_limit: 384m   # matches ../HYDRA-UMC-VOICE-UI/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LLM-based mission planner and semantic error recovery. Consumes
  # voice-ui intents and vla-engine action tokens, drives the
  # HYDRA-ORCHESTRATOR. See ../HYDRA-UMC-SEMANTIC-PLANNER.
  semantic-planner:
    build: ../HYDRA-UMC-SEMANTIC-PLANNER
    image: hydra-umc-semantic-planner:1.0.0
    container_name: hydra-umc-semantic-planner
    restart: unless-stopped
    mem_limit: 384m   # matches ../HYDRA-UMC-SEMANTIC-PLANNER/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vision-Language-Action engine: camera frames + text -> action tokens.
  # See ../HYDRA-UMC-VLA-ENGINE.
  vla-engine:
    build: ../HYDRA-UMC-VLA-ENGINE
    image: hydra-umc-vla-engine:1.0.0
    container_name: hydra-umc-vla-engine
    devices:
      - /dev/hailo0:/dev/hailo0
    restart: unless-stopped
    mem_limit: 768m   # matches ../HYDRA-UMC-VLA-ENGINE/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # RAG technical assistant grounded in the ecosystem's own docs. See
  # ../HYDRA-UMC-DOCS-QA.
  docs-qa:
    build: ../HYDRA-UMC-DOCS-QA
    image: hydra-umc-docs-qa:1.0.0
    container_name: hydra-umc-docs-qa
    restart: unless-stopped
    mem_limit: 768m   # matches ../HYDRA-UMC-DOCS-QA/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
