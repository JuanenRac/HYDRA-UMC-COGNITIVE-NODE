#
# Integration map for the Cognitive AI Node (Hailo-10 + CM5). This node is
# a real integration repo (not documentation-only): it owns the HydraOS
# image (os/) and the quantized LLM/VLA weights (models/) shared by its
# four children, and this file documents/reserves how those four children
# attach to it as sibling services on the same physical board.
#
# STATUS: this node's own Dockerfile plus all four children
# (hydra-umc-vla-engine, hydra-umc-voice-ui, hydra-umc-semantic-planner,
# hydra-umc-docs-qa) now have a real Dockerfile of their own. `docker
# compose up` builds and runs the real thing now, not just documents the
# wiring. Not build-tested (no Docker runtime on this dev machine) - every
# path/flag matches what each service's own systemd unit already runs
# live on the real CM5, same verification standard as
# HYDRA-UMC-VISION-NODE's own sibling Dockerfiles (0.0.7).
#
# `mem_limit` below mirrors each service's own already-chosen real
# MemoryMax from its systemd unit (systemd/*.service in this repo/each
# sibling repo) - never a new, invented number - so a container never
# gets a looser ceiling than the same service already runs under on bare
# metal. `healthcheck` hits each service's own real, already-existing
# lightweight GET route (`/health` for voice-ui, `/stats` everywhere
# else) - none of these routes were added for this file, they already
# existed for their own service's own tests/CLI.
#
# Image tags: each image is tagged with HYDRA_UMC_<NAME>_VERSION from the .env file next to this one, `latest` when it is not set.
# `hydra-umc-cognitive-node family-versions --workspace ..` prints those lines from the manifests of the checkouts the images are built from.
#
# Ports are published on the host's loopback only (127.0.0.1:<port>), which is
# where HYDRA-UMC-SERVER's proxy expects each service. They are the same ports
# the systemd units use, so run EITHER this stack OR the systemd units, never
# both. Required secrets (HYDRA_UMC_VOICE_UI_TOKEN and
# HYDRA_UMC_VOICE_UI_CONFIRM_SECRET, the latter at least 32 characters) come
# from a .env file next to this one or from your secret manager.
# =============================================================================

services:
  cognitive-node:
    build: .
    image: hydra-umc-cognitive-node:${HYDRA_UMC_COGNITIVE_NODE_VERSION:-latest}
    container_name: hydra-umc-cognitive-node
    # family-status reads each child's manifest, so those four files are
    # mounted where the node looks for them (the images do not contain the
    # sibling checkouts); the weights directory is passed explicitly because
    # after `pip install` the package no longer sits next to models/.
    environment:
      - HYDRA_UMC_COGNITIVE_NODE_WORKSPACE=/workspace
      - HYDRA_UMC_COGNITIVE_NODE_MODELS_DIR=/opt/hydra/models
      # where the children are inside this stack (family-status --probe and GET /family-status?probe=1 ask them for their health)
      - HYDRA_UMC_COGNITIVE_NODE_CHILD_URLS=HYDRA-UMC-VOICE-UI=http://voice-ui:8091,HYDRA-UMC-SEMANTIC-PLANNER=http://semantic-planner:8109,HYDRA-UMC-VLA-ENGINE=http://vla-engine:8098,HYDRA-UMC-DOCS-QA=http://docs-qa:8110
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./models:/opt/hydra/models:ro   # shared quantized LLM/VLA weights
      - ./os:/opt/hydra/os:ro           # HydraOS image/config reference
      - ../HYDRA-UMC-VLA-ENGINE/hydra-umc.project.json:/workspace/HYDRA-UMC-VLA-ENGINE/hydra-umc.project.json:ro
      - ../HYDRA-UMC-VOICE-UI/hydra-umc.project.json:/workspace/HYDRA-UMC-VOICE-UI/hydra-umc.project.json:ro
      - ../HYDRA-UMC-SEMANTIC-PLANNER/hydra-umc.project.json:/workspace/HYDRA-UMC-SEMANTIC-PLANNER/hydra-umc.project.json:ro
      - ../HYDRA-UMC-DOCS-QA/hydra-umc.project.json:/workspace/HYDRA-UMC-DOCS-QA/hydra-umc.project.json:ro
    depends_on:
      voice-ui:
        condition: service_healthy
      semantic-planner:
        condition: service_healthy
      vla-engine:
        condition: service_healthy
      docs-qa:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m   # matches systemd/hydra-umc-cognitive-node.service's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Speech-to-Action pipeline (STT/TTS). Today its only real client is the
  # Watch -> Android -> SERVER relay; feeding intents to the semantic-planner
  # is planned, not wired. See ../HYDRA-UMC-VOICE-UI.
  voice-ui:
    build: ../HYDRA-UMC-VOICE-UI
    image: hydra-umc-voice-ui:${HYDRA_UMC_VOICE_UI_VERSION:-latest}
    container_name: hydra-umc-voice-ui
    # http_service.py's own create_voice_gateway() refuses to bind beyond
    # loopback without a real bearer token (by design - see this
    # image's own Dockerfile comment) - supply a real secret via a real
    # .env file or your secret manager, never a value committed here.
    environment:
      - HYDRA_UMC_VOICE_UI_TOKEN=${HYDRA_UMC_VOICE_UI_TOKEN:?set a real token - see this file's own comment}
      # signs the confirmation tokens; without a fixed value every restart would invalidate them
      - HYDRA_UMC_VOICE_UI_CONFIRM_SECRET=${HYDRA_UMC_VOICE_UI_CONFIRM_SECRET:?set a secret of at least 32 characters}
    ports:
      - "127.0.0.1:8091:8091"
    restart: unless-stopped
    mem_limit: 384m   # matches ../HYDRA-UMC-VOICE-UI/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LLM-based mission planner and semantic error recovery. Consuming
  # voice-ui intents and vla-engine action tokens and driving the
  # HYDRA-ORCHESTRATOR are planned, not wired. See ../HYDRA-UMC-SEMANTIC-PLANNER.
  semantic-planner:
    build: ../HYDRA-UMC-SEMANTIC-PLANNER
    image: hydra-umc-semantic-planner:${HYDRA_UMC_SEMANTIC_PLANNER_VERSION:-latest}
    container_name: hydra-umc-semantic-planner
    ports:
      - "127.0.0.1:8109:8109"
    restart: unless-stopped
    mem_limit: 384m   # matches ../HYDRA-UMC-SEMANTIC-PLANNER/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8109/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vision-Language-Action engine: camera frames + text -> action tokens.
  # See ../HYDRA-UMC-VLA-ENGINE.
  vla-engine:
    build: ../HYDRA-UMC-VLA-ENGINE
    image: hydra-umc-vla-engine:${HYDRA_UMC_VLA_ENGINE_VERSION:-latest}
    container_name: hydra-umc-vla-engine
    ports:
      - "127.0.0.1:8098:8098"
    devices:
      - /dev/hailo0:/dev/hailo0
    # the engine looks for compiled models in <workspace>/HYDRA-UMC-COGNITIVE-NODE/models and its image sets the workspace to /workspace
    volumes:
      - ./models:/workspace/HYDRA-UMC-COGNITIVE-NODE/models:ro
    restart: unless-stopped
    mem_limit: 768m   # matches ../HYDRA-UMC-VLA-ENGINE/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # RAG technical assistant grounded in the ecosystem's own docs. See
  # ../HYDRA-UMC-DOCS-QA.
  docs-qa:
    build: ../HYDRA-UMC-DOCS-QA
    image: hydra-umc-docs-qa:${HYDRA_UMC_DOCS_QA_VERSION:-latest}
    container_name: hydra-umc-docs-qa
    ports:
      - "127.0.0.1:8110:8110"
    restart: unless-stopped
    mem_limit: 768m   # matches ../HYDRA-UMC-DOCS-QA/systemd's own MemoryMax
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8110/stats', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
