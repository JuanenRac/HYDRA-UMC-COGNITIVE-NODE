<title id="t">HYDRA-UMC-COGNITIVE-NODE architecture</title>
<desc id="d">HYDRA-UMC-COGNITIVE-NODE is the integration point of the Hailo-10 cognitive family: VLA-ENGINE, VOICE-UI, SEMANTIC-PLANNER and DOCS-QA. Today its real job is to read the manifest of each child, check the shared model-weights folder and, when asked, probe each child over HTTP, and to report that as a versioned JSON on the command line and over a read-only HTTP surface.</desc>
